<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小游戏合集</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Courier New', monospace;
  background: #0a0a1a;
  color: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 60px 20px;
}
h1 {
  font-size: 36px;
  color: #4af;
  margin-bottom: 40px;
  text-shadow: 0 0 20px rgba(68,170,255,0.4);
}
.games {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 24px;
  max-width: 700px;
  width: 100%;
}
.game-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(100,180,255,0.2);
  border-radius: 12px;
  padding: 32px 24px;
  text-decoration: none;
  color: #fff;
  transition: all 0.2s;
}
.game-card:hover {
  border-color: #4af;
  background: rgba(68,170,255,0.08);
  transform: translateY(-3px);
  box-shadow: 0 8px 30px rgba(68,170,255,0.15);
}
.game-card h2 { font-size: 20px; margin-bottom: 8px; color: #4af; }
.game-card p { font-size: 14px; color: #888; line-height: 1.6; }
</style>
</head>
<body>
<h1>小游戏合集</h1>
<div class="games">
  <a class="game-card" href="waterdrop/">
    <h2>末日之战 — 水滴</h2>
    <p>操控三体"水滴"探测器，以最短时间歼灭地球舰队。鼠标控制方向，8关逐步解锁。</p>
  </a>
  <a class="game-card" href="maze/">
    <h2>交通工具闯迷宫</h2>
    <p>选择交通工具闯迷宫，支持语音控制、数学/英语答题闯关，12个难度等级。</p>
  </a>
</div>
</body>
</html>
